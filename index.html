<!DOCTYPE html>
<html>
<head>
    <title>Interactive map with Leaflet</title>
    <link rel="icon" href="data:;base64,iVBORwOKGO=" />
    <link rel="stylesheet" href="css/libraries/jquery-ui.min.css">
    <link rel="stylesheet" href="css/libraries/bootstrap.css">
    <link rel="stylesheet" href="css/libraries/leaflet.css">
    <link rel="stylesheet" href="css/libraries/loading-bar.min.css">
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div id="my-map"></div>

    <div id="menusidebar" class="closed">
        <button id="close-btn" class="close-btn">&times;</button>
        <div class="dropdown-container">
            <div class="dropdown-label">Select Map Background</div>
            <select id="basemap-select" class="basemap-select">
                <option value="topo">Topo Map</option>
                <option value="esri">ESRI Satellite</option>
                <option value="osm">OpenStreetMap</option>
                
                <option value="cyclosm">CyclOSM</option>
                <option value="topgrey">Topo Grey</option>
                <option value="CARTdark">CARTO Darkmatter</option>
                <option value="NATgeo">NATgeo</option>
                <option value="WorldShaded">World Shaded</option>
                <option value="WorldTerrain">World Terrain</option>
                <option value="WorldPhysical">World Physical</option>

            </select>
        </div>

        <div class="data-source">
            Data Source: <a href="https://earthquake.usgs.gov/earthquakes/search/" target="_blank">usgs.gov</a>
        </div>
        <div class="map-source">
            Map Source: <a href="https://leaflet-extras.github.io/leaflet-providers/preview/" target="_blank">Leaflet Maps</a>
        </div>
    </div>

    <!-- menu btn icon-->
    <button id="menu-btn" class="menu-btn">
        <i class="fas fa-bars"></i> 
    </button>

            </select>
        </div>

        <div class="data-source">
            Data Source: <a href="https://earthquake.usgs.gov/earthquakes/search/" target="_blank">usgs.gov</a>
        </div>
        <div class="map-source">
            Map Source: <a href="https://leaflet-extras.github.io/leaflet-providers/preview/" target="_blank">Leaflet Maps</a>
        </div>
    </div>

    <!-- menu btn icon-->
    <button id="menu-btn" class="menu-btn">
        <i class="fas fa-bars"></i> 
    </button>

    <div class="d-grid gap-2 d-md-flex justify-content-md-end" style="top:-60px; height: 0px; overflow: visible; position: relative; z-index: 2000;">
        <button id="toggleSidebar" class="btn btn-primary me-md-2" style="margin-right: 10px; z-index: 2000; height:40px">Filter Options</button>
    </div>

    <div id="sidebar" style="z-index: 2000;"></div>

    
    <div id="timeline"></div>
    
    <div id="level3">
        <select id="attribute-select">
            <option value="magnitude" selected>Quakes by Magnitude</option>
            <option value="depth">Quakes by Depth</option>
            <option value="duration">Quakes by Duration</option>
        </select>
        <div id="magnitudeChart"></div>
        <div id="depthChart" style="display: none;"></div>
        <div id="durationChart" style="display: none;"></div>
        <div id="durationChart2" style="display: none;"></div>
        
        
    </div>
    
    <div id="tooltip"></div>
    <div id="tooltip2"></div>
    <div id="tooltip3"></div>
    <div id="loading-container" class="loading-container">
        <div class="spinner"></div>
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar">0%</div>
        </div>
        <br>
        <p id="loading-msg"></p>
    </div>
    
    <!-- library scripts -->
    <script src="js/libraries/d3.v6.min.js"></script>
    <script src="js/libraries/leaflet.js"></script>
    <script src="js/libraries/jquery-3.7.1.min.js"></script>
    <script src="js/libraries/jquery-ui.min.js"></script>
    <script src="js/libraries/popper.min.js"></script>
    <script src="js/libraries/bootstrap.min.js"></script>
    <script src="js/libraries/loading-bar.min.js"></script>

    <!-- our scripts -->
    <script type="module" src="js/main.js"></script>
    <script src="js/leafletMap.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/magnitudeChart.js"></script>
    <script src="js/depthChart.js"></script>
    <script src="js/durationChart.js"></script>
    <script src="js/durationChartV2.js"></script>


</body>
</html>
