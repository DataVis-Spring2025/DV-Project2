<!DOCTYPE html>
<html>
<head>
    <title>Interactive map with Leaflet</title>
    <link rel="icon" href="data:;base64,iVBORwOKGO=" />
    <link rel="stylesheet" href="css/libraries/jquery-ui.min.css">
    <link rel="stylesheet" href="css/libraries/bootstrap.css">
    <link rel="stylesheet" href="css/libraries/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
  <link rel="stylesheet" href="/resources/demos/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
 
</head>
<body>
    <div id="my-map"></div>

    <select id="basemap-select" class="basemap-select">
        <option value="topo">Topo Map</option>
        <option value="esri">ESRI Satellite</option>
        <option value="osm">OpenStreetMap</option>
        <option value="stamen">Stamen Terrain</option>
        
    </select>
    <button id="toggleSidebar" class="btn btn-primary">Filter Options</button>
    <div id="sidebar" style="z-index: 2000;">
      <p>
            <label for="magnitude">Magnitude Range:</label>
            <input type="text" id="magnitude" readonly="" style="border:0; color:#f6931f; font-weight:bold;">
          </p>
        <div id="slider-range" style="height:10px;"></div>

        <p>
            <label for="depth">Depth Range:</label>
            <input type="text" id="depth" readonly="" style="border:0; color:#f6931f; font-weight:bold;">
          </p>
          <br>
        <div id="slider-range1" style="height:10px;bottom: 20px;"></div>
        <div class="d-grid gap-2 col-10 mx-auto">
          <button id="filterButton" class="btn btn-primary" type="button" style="top: 20px;">Apply Filter</button>
        </div>
      </div>
    <div id="tooltip"></div>
    <div id="timeline"></div>
    <div id="level3">
        <div id="magnitudeChart"></div>
    </div>
<!-- Collapsible Sidebar -->

    <!-- library scripts -->
    <script src="js/libraries/d3.v6.min.js"></script>
    <script src="js/libraries/leaflet.js"></script>
    <script src="js/libraries/jquery-3.7.1.min.js"></script>
    <script src="js/libraries/jquery-ui.min.js"></script>
    <script src="js/libraries/popper.min.js"></script>
    <script src="js/libraries/bootstrap.min.js"></script>

    <!-- our scripts -->
    <script src="js/main.js"></script>
    <script src="js/leafletMap.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/magnitudeChart.js"></script>

</body>
</html>
