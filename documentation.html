<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Documentation</title>
    <script src="./js/libraries/drawdown.js"></script>
    <link rel="stylesheet" href="css/libraries/jquery-ui.min.css">
    <link rel="stylesheet" href="css/libraries/bootstrap.css">
    <link rel="stylesheet" href="css/libraries/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="/">Visualization</a>
    <div id="content"></div>
    <script>
        // Fetch the README.md file and render it as HTML
        fetch('README.md')
            .then(response => response.text())
            .then(text => {
                const html = markdown(text);
                document.getElementById('content').innerHTML = html;
            })
            .catch(error => console.error('Error loading README:', error));
    </script>
</body>
</html>
